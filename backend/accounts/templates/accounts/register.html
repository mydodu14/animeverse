<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - ANIMEVERSE</title>
</head>
<body>
    <h1>ANIMEVERSE</h1>
    <h2>Créer un compte</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Créer mon compte</button>
    </form>

    <p>Déjà inscrit ? 
        <a href="{% url 'login' %}">Se connecter</a>
    </p>
</body>
</html>
