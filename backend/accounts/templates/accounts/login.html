<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ANIMEVERSE</title>
</head>
<body>
    <h1>ANIMEVERSE</h1>

        {{ form.as_p }}

    <p>Pas encore de compte ?

    </p>

</html>
